<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YardSale Hub - Mid-County & Orange County</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Leaflet CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap');
    body { font-family: 'Inter', sans-serif; }
    #leafletMap { height: 100%; width: 100%; min-height: 520px; z-index: 1; }
    .line-clamp-1 { display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }
    .custom-avatar-pin {
      width: 38px; height: 38px; border-radius: 50%;
      border: 3px solid #059669; background: #ffffff;
      box-shadow: 0 4px 8px rgba(0,0,0,0.3); overflow: hidden;
      display: flex; align-items: center; justify-content: center;
    }
    .custom-avatar-pin img { width: 100%; height: 100%; object-fit: cover; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col">

  <!-- Header -->
  <header class="bg-emerald-600 text-white shadow-md sticky top-0 z-40">
    <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between gap-3">
      
      <!-- Logo -->
      <div onclick="resetFilters()" class="flex items-center space-x-2.5 cursor-pointer flex-shrink-0">
        <div class="bg-white text-emerald-600 w-9 h-9 rounded-xl font-black text-lg shadow flex items-center justify-center">
          <i class="fa-solid fa-tags"></i>
        </div>
        <div>
          <h1 class="text-lg font-black tracking-tight leading-none">YardSale Hub</h1>
          <p class="text-[9px] text-emerald-100 font-bold uppercase tracking-wider">Mid-County Marketplace</p>
        </div>
      </div>

      <!-- Search Bar -->
      <div class="hidden md:flex flex-1 max-w-md relative">
        <input type="text" id="searchInput" oninput="renderGrid()" placeholder="Search tools, furniture, electronics..." class="w-full pl-9 pr-4 py-2 rounded-full bg-emerald-700/60 text-white placeholder-emerald-200 border border-emerald-500 focus:outline-none focus:bg-white focus:text-slate-900 text-xs transition">
        <i class="fa-solid fa-magnifying-glass absolute left-3 top-2.5 text-emerald-200 text-xs"></i>
      </div>

      <!-- Navigation & Action Buttons -->
      <div class="flex items-center space-x-2">
        
        <!-- Grid / Map Toggle -->
        <div class="bg-emerald-700/60 p-1 rounded-lg flex items-center border border-emerald-500/40">
          <button id="viewGridBtn" onclick="switchMainView('grid')" class="px-2.5 py-1 rounded-md text-xs font-bold bg-white text-emerald-700 shadow">Grid</button>
          <button id="viewMapBtn" onclick="switchMainView('map')" class="px-2.5 py-1 rounded-md text-xs font-semibold text-emerald-100 hover:text-white">Map</button>
        </div>

        <!-- Saved / Favorites Button -->
        <button id="favoritesNavBtn" onclick="toggleFavoritesFilter()" type="button" class="bg-emerald-700 hover:bg-emerald-800 text-white p-2 sm:px-3 sm:py-2 rounded-lg text-xs font-semibold transition flex items-center space-x-1">
          <i class="fa-solid fa-heart text-rose-300"></i>
          <span class="hidden lg:inline">Saved</span>
        </button>

        <!-- Account / Sign In / Dashboard Button -->
        <button id="accountNavBtn" onclick="handleAccountNavClick()" type="button" class="bg-emerald-700 hover:bg-emerald-800 text-white px-3 py-1.5 rounded-lg text-xs font-bold transition flex items-center space-x-2 border border-emerald-500/50">
          <img id="navAvatarImg" src="" class="w-5 h-5 rounded-full object-cover hidden border border-white">
          <i id="navDefaultIcon" class="fa-solid fa-circle-user text-sm"></i>
          <span id="accountNavText">Sign In</span>
        </button>

        <!-- Sell Button -->
        <button onclick="handleSellButtonClick()" type="button" class="bg-amber-400 hover:bg-amber-300 text-slate-900 font-extrabold px-3 py-2 rounded-lg text-xs transition flex items-center space-x-1 shadow cursor-pointer">
          <i class="fa-solid fa-camera"></i>
          <span class="hidden sm:inline">Sell</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Mobile Search Bar -->
  <div class="md:hidden bg-emerald-600 px-4 pb-3">
    <input type="text" id="searchInputMobile" oninput="renderGrid()" placeholder="Search items near you..." class="w-full pl-8 pr-4 py-1.5 rounded-full bg-emerald-700/60 text-white placeholder-emerald-200 border border-emerald-500 focus:outline-none text-xs">
  </div>

  <!-- Filter Section -->
  <section class="bg-white border-b border-slate-200 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 py-3 flex flex-col sm:flex-row sm:items-center justify-between gap-2">
      <div>
        <h2 id="viewTitle" class="text-base font-bold text-slate-900">Local Listings</h2>
        <p class="text-slate-500 text-[11px]">Nederland • Groves • West Beaumont • Orange County</p>
      </div>

      <!-- Categories & Fulfillment Filters -->
      <div class="flex items-center space-x-2 overflow-x-auto pb-1 text-xs">
        <select id="fulfillmentFilter" onchange="renderGrid()" class="bg-slate-100 font-bold px-2.5 py-1.5 rounded-full border border-slate-300 text-xs">
          <option value="All">All Delivery Types</option>
          <option value="Local Pickup">Local Pickup</option>
          <option value="Shipping Available">Shipping</option>
        </select>

        <button onclick="filterCategory('All')" class="bg-emerald-100 text-emerald-800 font-bold px-3 py-1.5 rounded-full flex-shrink-0">All</button>
        <button onclick="filterCategory('Tools')" class="bg-slate-100 text-slate-700 font-semibold px-3 py-1.5 rounded-full hover:bg-slate-200 flex-shrink-0">Tools</button>
        <button onclick="filterCategory('Furniture')" class="bg-slate-100 text-slate-700 font-semibold px-3 py-1.5 rounded-full hover:bg-slate-200 flex-shrink-0">Furniture</button>
        <button onclick="filterCategory('Electronics')" class="bg-slate-100 text-slate-700 font-semibold px-3 py-1.5 rounded-full hover:bg-slate-200 flex-shrink-0">Electronics</button>
      </div>
    </div>
  </section>

  <!-- Main Content Container -->
  <main class="max-w-7xl mx-auto px-4 py-6 flex-1 w-full">
    <!-- Grid View -->
    <div id="itemsGrid" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-4"></div>

    <!-- Map View -->
    <div id="mapViewContainer" class="hidden bg-white rounded-2xl border border-slate-200 p-2 shadow-sm h-[550px] relative overflow-hidden">
      <div id="leafletMap" class="rounded-xl"></div>
    </div>
  </main>

  <!-- AUTH MODAL (Sign In / Register) -->
  <div id="authModal" class="hidden fixed inset-0 bg-slate-900/70 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div class="bg-white w-full max-w-sm rounded-2xl shadow-2xl overflow-hidden flex flex-col">
      <div class="bg-emerald-600 text-white px-5 py-3.5 flex items-center justify-between">
        <h3 id="authTitle" class="font-bold text-sm"><i class="fa-solid fa-user-lock mr-2"></i>Sign In</h3>
        <button onclick="closeModal('authModal')" class="text-white font-bold text-lg cursor-pointer">&times;</button>
      </div>

      <div class="p-5 text-xs space-y-3">
        <div class="flex border-b border-slate-200 mb-3">
          <button id="tabSignInBtn" onclick="switchAuthTab('signin')" class="flex-1 py-1.5 font-bold text-emerald-600 border-b-2 border-emerald-600 text-center">Sign In</button>
          <button id="tabRegisterBtn" onclick="switchAuthTab('register')" class="flex-1 py-1.5 font-semibold text-slate-400 text-center">Create Account</button>
        </div>

        <!-- Sign In Form -->
        <form id="signInForm" onsubmit="handleSignInSubmit(event)" class="space-y-3">
          <div>
            <label class="block font-semibold text-slate-700 mb-1">Username</label>
            <input type="text" id="signInUser" required placeholder="e.g. NederlandDave" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-xs">
          </div>
          <div>
            <label class="block font-semibold text-slate-700 mb-1">Password</label>
            <input type="password" required placeholder="••••••••" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-xs">
          </div>
          <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2.5 rounded-xl transition shadow">Sign In</button>
        </form>

        <!-- Register Form -->
        <form id="registerForm" onsubmit="handleRegisterSubmit(event)" class="hidden space-y-3">
          <div>
            <label class="block font-semibold text-slate-700 mb-1">Display Name *</label>
            <input type="text" id="regName" required placeholder="e.g. Dave's Garage Sales" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-xs">
          </div>
          <div>
            <label class="block font-semibold text-slate-700 mb-1">Username *</label>
            <input type="text" id="regUser" required placeholder="e.g. NederlandDave" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-xs">
          </div>
          <div>
            <label class="block font-semibold text-slate-700 mb-1">Location *</label>
            <select id="regLocation" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-xs bg-white">
              <option value="Nederland">Nederland</option>
              <option value="Groves">Groves</option>
              <option value="West Beaumont">West Beaumont</option>
              <option value="Orange County">Orange County</option>
            </select>
          </div>
          <div>
            <label class="block font-semibold text-slate-700 mb-1">Profile Photo Link (Optional)</label>
            <input type="url" id="regAvatar" placeholder="Image URL (Leaves default logo if empty)" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-xs">
          </div>
          <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2.5 rounded-xl transition shadow">Create Account</button>
        </form>
      </div>
    </div>
  </div>

  <!-- MY YARD SALE DASHBOARD MODAL -->
  <div id="dashboardModal" class="hidden fixed inset-0 bg-slate-900/70 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div class="bg-white w-full max-w-md rounded-2xl shadow-2xl overflow-hidden flex flex-col">
      <div class="bg-emerald-600 text-white px-5 py-3.5 flex items-center justify-between">
        <h3 class="font-bold text-sm"><i class="fa-solid fa-store mr-2"></i>My Yard Sale</h3>
        <button onclick="closeModal('dashboardModal')" class="text-white font-bold text-lg cursor-pointer">&times;</button>
      </div>

      <div class="p-5 text-xs space-y-4">
        <!-- User Banner -->
        <div class="p-3 bg-slate-900 text-white rounded-xl flex items-center justify-between">
          <div class="flex items-center space-x-3">
            <img id="dashAvatarImg" src="" class="w-10 h-10 rounded-full object-cover border-2 border-emerald-400">
            <div>
              <h4 id="dashName" class="font-bold text-sm">Seller Name</h4>
              <p id="dashMeta" class="text-[10px] text-emerald-400">Nederland • Verified Seller</p>
            </div>
          </div>
          <button onclick="handleSignOut()" class="bg-rose-600 hover:bg-rose-700 text-white font-bold px-2.5 py-1.5 rounded-lg text-[10px] transition">Sign Out</button>
        </div>

        <!-- Dashboard Navigation -->
        <div class="flex border-b border-slate-200 font-bold">
          <button id="dashTabItemsBtn" onclick="switchDashTab('items')" class="flex-1 py-2 text-emerald-600 border-b-2 border-emerald-600 text-center">My Active Items</button>
          <button id="dashTabInboxBtn" onclick="switchDashTab('inbox')" class="flex-1 py-2 text-slate-400 text-center">Inbox / Offers</button>
        </div>

        <!-- Items Tab -->
        <div id="dashItemsView" class="space-y-2 max-h-56 overflow-y-auto"></div>

        <!-- Inbox Tab -->
        <div id="dashInboxView" class="hidden space-y-2 max-h-56 overflow-y-auto"></div>
      </div>
    </div>
  </div>

  <!-- SELL ITEM MODAL -->
  <div id="sellModal" class="hidden fixed inset-0 bg-slate-900/70 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div class="bg-white w-full max-w-md rounded-2xl shadow-2xl overflow-hidden flex flex-col">
      <div class="bg-emerald-600 text-white px-5 py-3.5 flex items-center justify-between">
        <h3 class="font-bold text-sm"><i class="fa-solid fa-tag mr-2"></i>Post Item for Sale</h3>
        <button onclick="closeModal('sellModal')" class="text-white font-bold text-lg cursor-pointer">&times;</button>
      </div>

      <form onsubmit="handlePostItemSubmit(event)" class="p-5 text-xs space-y-3">
        <div>
          <label class="block font-semibold text-slate-700 mb-1">Item Title *</label>
          <input type="text" id="postTitle" required placeholder="e.g. DeWalt Cordless Drill Kit" class="w-full px-3 py-2 border border-slate-300 rounded-lg">
        </div>
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block font-semibold text-slate-700 mb-1">Price ($) *</label>
            <input type="number" id="postPrice" required placeholder="45" class="w-full px-3 py-2 border border-slate-300 rounded-lg">
          </div>
          <div>
            <label class="block font-semibold text-slate-700 mb-1">Category</label>
            <select id="postCategory" class="w-full px-3 py-2 border border-slate-300 rounded-lg bg-white">
              <option value="Tools">Tools</option>
              <option value="Furniture">Furniture</option>
              <option value="Electronics">Electronics</option>
              <option value="Apparel">Apparel</option>
            </select>
          </div>
        </div>
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block font-semibold text-slate-700 mb-1">Condition</label>
            <select id="postCondition" class="w-full px-3 py-2 border border-slate-300 rounded-lg bg-white">
              <option value="New">New</option>
              <option value="Like New">Like New</option>
              <option value="Good" selected>Good</option>
              <option value="Fair">Fair</option>
            </select>
          </div>
          <div>
            <label class="block font-semibold text-slate-700 mb-1">Neighborhood</label>
            <select id="postLocation" class="w-full px-3 py-2 border border-slate-300 rounded-lg bg-white">
              <option value="Nederland">Nederland</option>
              <option value="Groves">Groves</option>
              <option value="West Beaumont">West Beaumont</option>
              <option value="Orange County">Orange County</option>
            </select>
          </div>
        </div>
        <div>
          <label class="block font-semibold text-slate-700 mb-1">Fulfillment Option</label>
          <select id="postFulfillment" class="w-full px-3 py-2 border border-slate-300 rounded-lg bg-white">
            <option value="Local Pickup">Local Pickup Only</option>
            <option value="Shipping Available">Shipping Available</option>
          </select>
        </div>
        <div>
          <label class="block font-semibold text-slate-700 mb-1">Photo Link URL</label>
          <input type="url" id="postPhoto" placeholder="Paste image URL or leave blank" class="w-full px-3 py-2 border border-slate-300 rounded-lg">
        </div>
        <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-extrabold py-2.5 rounded-xl shadow transition">Publish Listing</button>
      </form>
    </div>
  </div>

  <!-- ITEM DETAILS & OFFER MODAL -->
  <div id="itemDetailModal" class="hidden fixed inset-0 bg-slate-900/70 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div class="bg-white w-full max-w-md rounded-2xl shadow-2xl overflow-hidden flex flex-col">
      <div class="relative h-52 bg-slate-900">
        <img id="detailImg" src="" class="w-full h-full object-cover">
        <button onclick="closeModal('itemDetailModal')" class="absolute top-3 right-3 bg-slate-900/80 text-white w-7 h-7 rounded-full font-bold text-sm">&times;</button>
      </div>

      <div class="p-4 text-xs space-y-3">
        <div class="flex justify-between items-start">
          <div>
            <h3 id="detailTitle" class="font-bold text-sm text-slate-900">Title</h3>
            <p id="detailMeta" class="text-[10px] text-slate-500">Seller • Location</p>
          </div>
          <div id="detailPrice" class="text-xl font-black text-emerald-600">$0</div>
        </div>

        <form onsubmit="handleSendOfferSubmit(event)" class="border-t border-slate-200 pt-3 space-y-2">
          <p class="font-bold text-slate-800"><i class="fa-solid fa-comments text-emerald-600 mr-1"></i>Send Cash Offer</p>
          <div class="flex gap-2">
            <input type="number" id="offerPrice" placeholder="Offer ($)" class="w-1/3 px-3 py-1.5 border border-slate-300 rounded-lg text-xs font-bold">
            <input type="text" id="offerMsg" required placeholder="Is this available?" class="flex-1 px-3 py-1.5 border border-slate-300 rounded-lg text-xs">
          </div>
          <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2 rounded-xl">Send Offer</button>
        </form>
      </div>
    </div>
  </div>

  <script>
    var DEFAULT_LOGO_AVATAR = "data:image/svg+xml;charset=UTF-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23059669'/%3E%3Cpath d='M30 35 L50 20 L70 35 L70 75 L30 75 Z' fill='%23ffffff'/%3E%3Cpath d='M42 45 L58 45 L58 65 L42 65 Z' fill='%23059669'/%3E%3C/svg%3E";

    var map = null;
    var mapMarkers = [];
    var currentUser = null;
    var activeCategory = 'All';
    var showOnlyFavorites = false;
    var activeItem = null;

    var areaCoords = {
      'Nederland': [29.9749, -93.9924],
      'Groves': [29.9488, -93.9168],
      'West Beaumont': [30.0802, -94.1266],
      'Orange County': [30.0933, -93.7360]
    };

    var defaultItems = [
      {
        id: 'item_1', sellerId: 'user_dave', sellerName: "Dave's Tools", sellerAvatar: DEFAULT_LOGO_AVATAR,
        title: "DeWalt 20V Cordless Drill Kit", price: 45, category: "Tools", condition: "Like New",
        location: "Nederland", fulfillment: "Local Pickup",
        photo: "https://images.unsplash.com/photo-1504148455328-c376907d081c?auto=format&fit=crop&w=600&q=80",
        timestamp: Date.now() - 100000
      },
      {
        id: 'item_2', sellerId: 'user_sarah', sellerName: "Sarah M.", sellerAvatar: "https://images.unsplash.com/photo-1494790108377-be9c29b29330?auto=format&fit=crop&w=200&q=80",
        title: "Solid Oak Coffee Table", price: 40, category: "Furniture", condition: "Good",
        location: "Groves", fulfillment: "Local Pickup",
        photo: "https://images.unsplash.com/photo-1533090161767-e6ffed986c88?auto=format&fit=crop&w=600&q=80",
        timestamp: Date.now() - 200000
      }
    ];

    function getStoredItems() {
      var saved = localStorage.getItem('yardsale_items_v5');
      return saved ? JSON.parse(saved) : defaultItems;
    }
    function saveStoredItems(items) { localStorage.setItem('yardsale_items_v5', JSON.stringify(items)); }

    function getStoredFavs() { return JSON.parse(localStorage.getItem('yardsale_favs_v5') || '[]'); }
    function saveStoredFavs(favs) { localStorage.setItem('yardsale_favs_v5', JSON.stringify(favs)); }

    function getStoredMsgs() { return JSON.parse(localStorage.getItem('yardsale_msgs_v5') || '[]'); }
    function saveStoredMsgs(msgs) { localStorage.setItem('yardsale_msgs_v5', JSON.stringify(msgs)); }

    function closeModal(id) { document.getElementById(id).classList.add('hidden'); }
    function openModal(id) { document.getElementById(id).classList.remove('hidden'); }

    function switchMainView(view) {
      var isGrid = view === 'grid';
      document.getElementById('itemsGrid').classList.toggle('hidden', !isGrid);
      document.getElementById('mapViewContainer').classList.toggle('hidden', isGrid);

      document.getElementById('viewGridBtn').className = isGrid 
        ? "px-2.5 py-1 rounded-md text-xs font-bold bg-white text-emerald-700 shadow"
        : "px-2.5 py-1 rounded-md text-xs font-semibold text-emerald-100 hover:text-white";

      document.getElementById('viewMapBtn').className = !isGrid 
        ? "px-2.5 py-1 rounded-md text-xs font-bold bg-white text-emerald-700 shadow"
        : "px-2.5 py-1 rounded-md text-xs font-semibold text-emerald-100 hover:text-white";

      if (!isGrid) initLeafletMap();
    }

    function initLeafletMap() {
      setTimeout(function() {
        if (!map) {
          map = L.map('leafletMap').setView([29.98, -93.95], 11);
          L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 18 }).addTo(map);
        }
        map.invalidateSize();
        renderMapMarkers();
      }, 100);
    }

    function renderMapMarkers() {
      if (!map) return;
      mapMarkers.forEach(function(m) { map.removeLayer(m); });
      mapMarkers = [];

      var items = getFilteredItems();
      items.forEach(function(item) {
        var baseCoords = areaCoords[item.location] || [29.98, -93.95];
        var lat = baseCoords[0] + (Math.random() - 0.5) * 0.02;
        var lng = baseCoords[1] + (Math.random() - 0.5) * 0.02;

        var avatarUrl = item.sellerAvatar || DEFAULT_LOGO_AVATAR;
        var customIcon = L.divIcon({
          className: 'custom-pin-wrapper',
          html: `<div class="custom-avatar-pin"><img src="${avatarUrl}"></div>`,
          iconSize: [38, 38], iconAnchor: [19, 19]
        });

        var marker = L.marker([lat, lng], { icon: customIcon }).addTo(map);
        marker.bindPopup(`
          <div style="width: 150px; text-align:center;">
            <img src="${item.photo}" style="width:100%; height:80px; object-fit:cover; border-radius:6px;">
            <div style="font-weight:bold; font-size:11px; margin-top:4px;">${item.title}</div>
            <div style="color:#059669; font-weight:bold;">$${item.price}</div>
          </div>
        `);
        mapMarkers.push(marker);
      });
    }

    function toggleFavorite(e, id) {
      e.stopPropagation();
      var favs = getStoredFavs();
      var idx = favs.indexOf(id);
      if (idx > -1) favs.splice(idx, 1);
      else favs.push(id);
      saveStoredFavs(favs);
      renderGrid();
    }

    function toggleFavoritesFilter() {
      showOnlyFavorites = !showOnlyFavorites;
      document.getElementById('favoritesNavBtn').classList.toggle('bg-rose-600', showOnlyFavorites);
      renderGrid();
    }

    function filterCategory(cat) { activeCategory = cat; renderGrid(); }
    function resetFilters() {
      showOnlyFavorites = false; activeCategory = 'All';
      document.getElementById('searchInput').value = '';
      renderGrid();
    }

    function getFilteredItems() {
      var items = getStoredItems();
      var search = (document.getElementById('searchInput').value || document.getElementById('searchInputMobile').value || "").toLowerCase();
      var fulfillment = document.getElementById('fulfillmentFilter').value;
      var favs = getStoredFavs();

      items.sort(function(a, b) { return (b.timestamp || 0) - (a.timestamp || 0); });

      if (showOnlyFavorites) items = items.filter(function(i) { return favs.includes(i.id); });
      if (activeCategory !== 'All') items = items.filter(function(i) { return i.category === activeCategory; });
      if (fulfillment !== 'All') items = items.filter(function(i) { return i.fulfillment === fulfillment; });
      if (search) items = items.filter(function(i) { return i.title.toLowerCase().includes(search); });

      return items;
    }

    function renderGrid() {
      var grid = document.getElementById('itemsGrid');
      var items = getFilteredItems();
      var favs = getStoredFavs();

      if (items.length === 0) {
        grid.innerHTML = '<div class="col-span-full text-center py-12 text-slate-400">No items found.</div>';
        return;
      }

      grid.innerHTML = items.map(function(item) {
        var isFav = favs.includes(item.id);
        var avatarUrl = item.sellerAvatar || DEFAULT_LOGO_AVATAR;

        return `
          <div onclick="openItemDetails('${item.id}')" class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden hover:shadow-md transition cursor-pointer flex flex-col justify-between">
            <div>
              <div class="relative h-36 bg-slate-100">
                <img src="${item.photo}" class="w-full h-full object-cover">
                <button onclick="toggleFavorite(event, '${item.id}')" class="absolute top-2 right-2 w-7 h-7 rounded-full bg-slate-900/60 flex items-center justify-center text-white">
                  <i class="fa-solid fa-heart ${isFav ? 'text-rose-500' : 'text-slate-300'} text-xs"></i>
                </button>
                <span class="absolute top-2 left-2 bg-slate-900/80 text-white font-bold text-[9px] px-1.5 py-0.5 rounded">${item.condition}</span>
              </div>
              <div class="p-3">
                <div class="flex items-center space-x-1 text-[10px] text-slate-500 mb-1">
                  <img src="${avatarUrl}" class="w-3.5 h-3.5 rounded-full object-cover">
                  <span class="font-bold text-emerald-800">${item.sellerName}</span>
                </div>
                <h3 class="font-bold text-slate-900 text-xs line-clamp-1">${item.title}</h3>
                <div class="text-sm font-extrabold text-slate-900 mt-1">$${item.price}</div>
              </div>
            </div>
            <div class="px-3 pb-3">
              <span class="block w-full text-center bg-slate-100 text-slate-700 font-bold py-1 rounded text-[10px]">View & Offer</span>
            </div>
          </div>
        `;
      }).join('');

      renderMapMarkers();
    }

    function openItemDetails(id) {
      var item = getStoredItems().find(function(i) { return i.id === id; });
      if (!item) return;
      activeItem = item;
      document.getElementById('detailTitle').innerText = item.title;
      document.getElementById('detailPrice').innerText = '$' + item.price;
      document.getElementById('detailMeta').innerText = item.sellerName + ' • ' + item.location;
      document.getElementById('detailImg').src = item.photo;
      openModal('itemDetailModal');
    }

    function handleSendOfferSubmit(e) {
      e.preventDefault();
      if (!activeItem) return;
      var msgs = getStoredMsgs();
      msgs.unshift({
        id: 'msg_' + Date.now(),
        sellerId: activeItem.sellerId,
        buyerName: currentUser ? currentUser.name : 'Buyer Neighbor',
        itemTitle: activeItem.title,
        offerPrice: document.getElementById('offerPrice').value,
        text: document.getElementById('offerMsg').value
      });
      saveStoredMsgs(msgs);
      closeModal('itemDetailModal');
      alert('Offer sent to seller!');
    }

    function handleAccountNavClick() {
      if (currentUser) {
        renderDashboard();
        openModal('dashboardModal');
      } else {
        openModal('authModal');
      }
    }

    function handleSellButtonClick() {
      if (!currentUser) {
        alert("Please sign in or create an account first!");
        openModal('authModal');
      } else {
        openModal('sellModal');
      }
    }

    function switchAuthTab(tab) {
      var isSignIn = tab === 'signin';
      document.getElementById('signInForm').classList.toggle('hidden', !isSignIn);
      document.getElementById('registerForm').classList.toggle('hidden', isSignIn);
      document.getElementById('tabSignInBtn').className = isSignIn ? "flex-1 py-1.5 font-bold text-emerald-600 border-b-2 border-emerald-600 text-center" : "flex-1 py-1.5 font-semibold text-slate-400 text-center";
      document.getElementById('tabRegisterBtn').className = !isSignIn ? "flex-1 py-1.5 font-bold text-emerald-600 border-b-2 border-emerald-600 text-center" : "flex-1 py-1.5 font-semibold text-slate-400 text-center";
    }

    function handleSignInSubmit(e) {
      e.preventDefault();
      currentUser = {
        id: 'user_dave',
        name: document.getElementById('signInUser').value || "Dave's Yard Sale",
        location: 'Nederland',
        avatar: DEFAULT_LOGO_AVATAR
      };
      updateHeaderUser();
      closeModal('authModal');
    }

    function handleRegisterSubmit(e) {
      e.preventDefault();
      var customAv = document.getElementById('regAvatar').value;
      currentUser = {
        id: 'user_' + Date.now(),
        name: document.getElementById('regName').value,
        location: document.getElementById('regLocation').value,
        avatar: customAv.trim() !== '' ? customAv : DEFAULT_LOGO_AVATAR
      };
      updateHeaderUser();
      closeModal('authModal');
    }

    function handleSignOut() {
      currentUser = null;
      updateHeaderUser();
      closeModal('dashboardModal');
    }

    function updateHeaderUser() {
      var nameText = document.getElementById('accountNavText');
      var navImg = document.getElementById('navAvatarImg');
      var navIcon = document.getElementById('navDefaultIcon');

      if (currentUser) {
        nameText.innerText = currentUser.name;
        navImg.src = currentUser.avatar || DEFAULT_LOGO_AVATAR;
        navImg.classList.remove('hidden');
        navIcon.classList.add('hidden');
      } else {
        nameText.innerText = "Sign In";
        navImg.classList.add('hidden');
        navIcon.classList.remove('hidden');
      }
    }

    function switchDashTab(tab) {
      var isItems = tab === 'items';
      document.getElementById('dashItemsView').classList.toggle('hidden', !isItems);
      document.getElementById('dashInboxView').classList.toggle('hidden', isItems);
      document.getElementById('dashTabItemsBtn').className = isItems ? "flex-1 py-2 text-emerald-600 border-b-2 border-emerald-600 text-center" : "flex-1 py-2 text-slate-400 text-center";
      document.getElementById('dashTabInboxBtn').className = !isItems ? "flex-1 py-2 text-emerald-600 border-b-2 border-emerald-600 text-center" : "flex-1 py-2 text-slate-400 text-center";
    }

    function renderDashboard() {
      if (!currentUser) return;
      document.getElementById('dashName').innerText = currentUser.name;
      document.getElementById('dashMeta').innerText = currentUser.location + " • Verified Seller";
      document.getElementById('dashAvatarImg').src = currentUser.avatar || DEFAULT_LOGO_AVATAR;

      var items = getStoredItems().filter(function(i) { return i.sellerId === currentUser.id; });
      var itemsView = document.getElementById('dashItemsView');

      if (items.length === 0) {
        itemsView.innerHTML = '<p class="text-slate-400 py-3 text-center">No active listings.</p>';
      } else {
        itemsView.innerHTML = items.map(function(item) {
          return `
            <div class="flex items-center justify-between p-2 bg-slate-50 rounded-lg border border-slate-200">
              <div class="flex items-center space-x-2">
                <img src="${item.photo}" class="w-8 h-8 rounded object-cover">
                <div><p class="font-bold">${item.title}</p><p class="text-[10px] text-slate-500">$${item.price}</p></div>
              </div>
              <button onclick="bumpListing('${item.id}')" class="bg-emerald-100 text-emerald-800 font-bold px-2 py-1 rounded text-[10px]">Bump Feed</button>
            </div>
          `;
        }).join('');
      }

      var msgs = getStoredMsgs();
      var inboxView = document.getElementById('dashInboxView');
      if (msgs.length === 0) {
        inboxView.innerHTML = '<p class="text-slate-400 py-3 text-center">No offers received.</p>';
      } else {
        inboxView.innerHTML = msgs.map(function(m) {
          return `
            <div class="p-2 bg-slate-50 rounded-lg border border-slate-200 space-y-1">
              <div class="flex justify-between font-bold"><span>${m.buyerName}</span><span class="text-amber-700">Offer: $${m.offerPrice}</span></div>
              <p class="text-[10px] text-slate-500">Item: ${m.itemTitle}</p>
              <p class="italic bg-white p-1 rounded border">"${m.text}"</p>
            </div>
          `;
        }).join('');
      }
    }

    function bumpListing(id) {
      var items = getStoredItems();
      var item = items.find(function(i) { return i.id === id; });
      if (item) {
        item.timestamp = Date.now();
        saveStoredItems(items);
        renderDashboard();
        renderGrid();
        alert('Listing bumped!');
      }
    }

    function handlePostItemSubmit(e) {
      e.preventDefault();
      var items = getStoredItems();
      items.unshift({
        id: 'item_' + Date.now(),
        sellerId: currentUser ? currentUser.id : 'anon',
        sellerName: currentUser ? currentUser.name : 'Local Seller',
        sellerAvatar: currentUser ? currentUser.avatar : DEFAULT_LOGO_AVATAR,
        title: document.getElementById('postTitle').value,
        price: Number(document.getElementById('postPrice').value),
        category: document.getElementById('postCategory').value,
        condition: document.getElementById('postCondition').value,
        location: document.getElementById('postLocation').value,
        fulfillment: document.getElementById('postFulfillment').value,
        photo: document.getElementById('postPhoto').value || 'https://images.unsplash.com/photo-1526170375885-4d8ecf77b99f?auto=format&fit=crop&w=600&q=80',
        timestamp: Date.now()
      });
      saveStoredItems(items);
      closeModal('sellModal');
      renderGrid();
      alert('Listing published!');
    }

    window.addEventListener('DOMContentLoaded', function() {
      updateHeaderUser();
      renderGrid();
    });
  </script>
</body>
</html>
