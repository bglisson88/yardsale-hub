<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YardSale Hub - Local Buy & Sell Marketplace</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Leaflet CSS & JS for Real Interactive Maps -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
    body { font-family: 'Inter', sans-serif; }
    #leafletMap { height: 100%; width: 100%; min-height: 480px; z-index: 1; }
    .leaflet-popup-content-wrapper { border-radius: 12px; padding: 4px; }
    .line-clamp-1 { display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col pb-20 md:pb-0">

  <!-- Header -->
  <header class="bg-emerald-600 text-white shadow-md sticky top-0 z-40">
    <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between gap-3">
      
      <!-- Logo -->
      <div class="flex items-center space-x-3 cursor-pointer flex-shrink-0" onclick="resetFilters()">
        <div class="bg-white text-emerald-600 p-2 rounded-xl font-bold text-xl shadow-sm">
          <i class="fa-solid fa-tags"></i>
        </div>
        <div>
          <h1 class="text-xl font-black tracking-tight leading-none">YardSale Hub</h1>
          <p class="text-[10px] text-emerald-100 font-semibold tracking-wider uppercase">Local Buy & Sell</p>
        </div>
      </div>

      <!-- Search Bar -->
      <div class="hidden md:flex flex-1 max-w-md relative">
        <input type="text" id="searchInput" oninput="handleSearch()" placeholder="Search tools, furniture, electronics..." class="w-full pl-10 pr-4 py-2 rounded-full bg-emerald-700/60 text-white placeholder-emerald-200 border border-emerald-500 focus:outline-none focus:bg-white focus:text-slate-900 focus:placeholder-slate-400 text-sm transition">
        <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-2.5 text-emerald-200"></i>
      </div>

      <!-- Action Buttons -->
      <div class="flex items-center space-x-2 sm:space-x-3">
        
        <!-- View Toggle -->
        <div class="bg-emerald-700/60 p-1 rounded-lg flex items-center border border-emerald-500/40">
          <button id="viewGridBtn" onclick="switchMainView('grid')" class="px-2.5 py-1 rounded-md text-xs font-bold bg-white text-emerald-700 shadow"><i class="fa-solid fa-border-all"></i> Grid</button>
          <button id="viewMapBtn" onclick="switchMainView('map')" class="px-2.5 py-1 rounded-md text-xs font-semibold text-emerald-100 hover:text-white"><i class="fa-solid fa-map-location-dot"></i> Map</button>
        </div>

        <!-- Favorites Button -->
        <button onclick="toggleFavoritesFilter()" id="favoritesNavBtn" type="button" class="bg-emerald-700 hover:bg-emerald-800 text-white p-2 sm:px-3 sm:py-2 rounded-lg text-xs md:text-sm font-medium transition flex items-center space-x-1.5 cursor-pointer">
          <i class="fa-solid fa-heart text-rose-300"></i>
          <span class="hidden lg:inline">Saved</span>
        </button>

        <!-- Messages Inbox -->
        <button onclick="openAccountModal('messages')" type="button" class="relative bg-emerald-700 hover:bg-emerald-800 text-white p-2 sm:px-3 sm:py-2 rounded-lg text-xs md:text-sm font-medium transition flex items-center space-x-1.5 cursor-pointer">
          <i class="fa-solid fa-comment-dots text-base"></i>
          <span class="hidden lg:inline">Inbox</span>
        </button>

        <!-- Account Button -->
        <button id="accountNavBtn" onclick="openAccountModal('dashboard')" type="button" class="bg-emerald-700 hover:bg-emerald-800 text-white px-3 py-2 rounded-lg text-xs md:text-sm font-medium transition flex items-center space-x-1.5 cursor-pointer">
          <i class="fa-solid fa-circle-user text-base"></i>
          <span id="accountNavText" class="hidden sm:inline">Sign In</span>
        </button>

        <!-- Sell Button -->
        <button onclick="handleListButtonClick()" type="button" class="bg-amber-400 hover:bg-amber-300 text-slate-900 font-extrabold px-3 py-2 rounded-lg text-xs md:text-sm transition flex items-center space-x-1.5 shadow cursor-pointer active:scale-95">
          <i class="fa-solid fa-camera"></i>
          <span class="hidden sm:inline">Sell</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Mobile Search Bar -->
  <div class="md:hidden bg-emerald-600 px-4 pb-3">
    <div class="relative">
      <input type="text" id="searchInputMobile" oninput="handleSearch()" placeholder="Search items near you..." class="w-full pl-9 pr-4 py-1.5 rounded-full bg-emerald-700/60 text-white placeholder-emerald-200 border border-emerald-500 focus:outline-none text-xs">
      <i class="fa-solid fa-magnifying-glass absolute left-3 top-2 text-emerald-200 text-xs"></i>
    </div>
  </div>

  <!-- Hero & Filter Bar -->
  <section class="bg-white border-b border-slate-200 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 py-3">
      <div class="flex flex-col md:flex-row md:items-center justify-between gap-3">
        <div>
          <h2 id="viewTitle" class="text-lg font-bold text-slate-900">Items Near You</h2>
          <p id="viewSubtitle" class="text-slate-500 text-xs">Nederland • Groves • West Beaumont • Orange County</p>
        </div>
        
        <!-- Category & Fulfillment Filters -->
        <div class="flex items-center space-x-2 overflow-x-auto pb-1 text-xs">
          <button id="resetFilterBtn" onclick="resetFilters()" type="button" class="hidden bg-emerald-700 text-white font-bold px-3 py-1.5 rounded-full flex-shrink-0">
            <i class="fa-solid fa-xmark mr-1"></i> Clear Filter
          </button>

          <!-- Fulfillment Filter -->
          <select id="fulfillmentFilter" onchange="renderGrid()" class="bg-slate-100 text-slate-700 font-bold px-3 py-1.5 rounded-full border border-slate-300 text-xs">
            <option value="All">All Delivery Types</option>
            <option value="Local Pickup">Local Pickup Only</option>
            <option value="Shipping Available">Shipping Available</option>
          </select>

          <button onclick="filterCategory('All')" class="cat-btn bg-emerald-100 text-emerald-800 font-bold px-3 py-1.5 rounded-full flex-shrink-0">All</button>
          <button onclick="filterCategory('Furniture')" class="cat-btn bg-slate-100 text-slate-700 font-semibold px-3 py-1.5 rounded-full hover:bg-slate-200 flex-shrink-0">Furniture</button>
          <button onclick="filterCategory('Electronics')" class="cat-btn bg-slate-100 text-slate-700 font-semibold px-3.5 py-1.5 rounded-full hover:bg-slate-200 flex-shrink-0">Electronics</button>
          <button onclick="filterCategory('Tools')" class="cat-btn bg-slate-100 text-slate-700 font-semibold px-3.5 py-1.5 rounded-full hover:bg-slate-200 flex-shrink-0">Tools & Lawn</button>
          <button onclick="filterCategory('Apparel')" class="cat-btn bg-slate-100 text-slate-700 font-semibold px-3.5 py-1.5 rounded-full hover:bg-slate-200 flex-shrink-0">Apparel</button>
        </div>
      </div>
    </div>
  </section>

  <!-- Main Container -->
  <main class="max-w-7xl mx-auto px-4 py-6 flex-1 w-full">
    
    <!-- GRID VIEW -->
    <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-4" id="itemsGrid">
      <!-- Renders dynamically -->
    </div>

    <!-- REAL MAP VIEW -->
    <div id="mapViewContainer" class="hidden bg-white rounded-2xl border border-slate-200 p-2 shadow-sm h-[550px] flex flex-col relative overflow-hidden">
      <div id="leafletMap" class="rounded-xl"></div>
    </div>
  </main>

  <!-- Floating Mobile Sell Button -->
  <button onclick="handleListButtonClick()" type="button" class="md:hidden fixed bottom-6 right-6 bg-emerald-600 text-white font-extrabold px-5 py-3.5 rounded-full shadow-2xl flex items-center space-x-2 z-30 active:scale-95 transition cursor-pointer border-2 border-white">
    <i class="fa-solid fa-camera text-lg"></i>
    <span class="text-sm">Sell Item</span>
  </button>

  <!-- ACCOUNT & INBOX MODAL -->
  <div id="accountModal" class="hidden fixed inset-0 bg-slate-900/70 backdrop-blur-sm z-50 flex items-center justify-center p-4" onclick="closeAccountModal(event)">
    <div class="bg-white w-full max-w-lg rounded-2xl shadow-2xl overflow-hidden max-h-[90vh] flex flex-col" onclick="event.stopPropagation()">
      <div class="bg-emerald-600 text-white px-6 py-4 flex items-center justify-between">
        <h3 class="font-bold text-base"><i class="fa-solid fa-circle-user mr-2"></i>Seller Hub & Messages</h3>
        <button onclick="toggleElement('accountModal', false)" type="button" class="text-emerald-100 hover:text-white text-2xl font-bold cursor-pointer px-2">&times;</button>
      </div>

      <div class="p-6 overflow-y-auto space-y-4 text-sm flex-1">
        
        <!-- Auth Container -->
        <div id="authFormsContainer">
          <div class="flex border-b border-slate-200 mb-4">
            <button id="tabLogin" onclick="switchAuthTab('login')" class="flex-1 py-2 font-bold text-emerald-600 border-b-2 border-emerald-600 text-center">Sign In</button>
            <button id="tabRegister" onclick="switchAuthTab('register')" class="flex-1 py-2 font-semibold text-slate-400 text-center">Create Account</button>
          </div>

          <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-3">
            <div>
              <label class="block font-semibold text-slate-700 mb-1 text-xs">Username</label>
              <input type="text" id="loginUsername" required placeholder="e.g. NederlandDave" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-xs">
            </div>
            <div>
              <label class="block font-semibold text-slate-700 mb-1 text-xs">Password</label>
              <input type="password" id="loginPassword" required placeholder="••••••••" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-xs">
            </div>
            <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2.5 rounded-xl shadow transition text-xs">Sign In</button>
          </form>

          <form id="registerForm" onsubmit="handleRegister(event)" class="hidden space-y-3">
            <div>
              <label class="block font-semibold text-slate-700 mb-1 text-xs">Display Name *</label>
              <input type="text" id="regName" required placeholder="e.g. Dave's Mid-County Sales" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-xs">
            </div>
            <div>
              <label class="block font-semibold text-slate-700 mb-1 text-xs">Username *</label>
              <input type="text" id="regUsername" required placeholder="e.g. NederlandDave" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-xs">
            </div>
            <div>
              <label class="block font-semibold text-slate-700 mb-1 text-xs">Neighborhood *</label>
              <select id="regLocation" class="w-full px-3 py-2 border border-slate-300 rounded-lg bg-white text-xs">
                <option value="Nederland">Nederland</option>
                <option value="Groves">Groves</option>
                <option value="West Beaumont">West Beaumont</option>
                <option value="Orange County">Orange County</option>
              </select>
            </div>
            <div>
              <label class="block font-semibold text-slate-700 mb-1 text-xs">Password *</label>
              <input type="password" id="regPassword" required placeholder="Create password" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-xs">
            </div>
            <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2.5 rounded-xl shadow transition text-xs">Register Profile</button>
          </form>
        </div>

        <!-- Dashboard Container -->
        <div id="userDashboardContainer" class="hidden space-y-4">
          <div class="p-4 bg-slate-900 text-white rounded-xl shadow flex items-center justify-between">
            <div class="flex items-center space-x-3">
              <div class="w-10 h-10 rounded-full bg-emerald-500 text-white font-black text-lg flex items-center justify-center shadow" id="dashAvatar">D</div>
              <div>
                <h4 id="dashName" class="font-bold text-white text-sm">Seller Name</h4>
                <p id="dashMeta" class="text-[11px] text-slate-300">Nederland • Verified Seller</p>
              </div>
            </div>
            <button onclick="handleLogout()" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-1.5 rounded-lg font-semibold border border-slate-700">Sign Out</button>
          </div>

          <div class="flex border-b border-slate-200 text-xs font-bold">
            <button id="dashTabListings" onclick="switchDashTab('listings')" class="flex-1 py-2 text-emerald-600 border-b-2 border-emerald-600 text-center">My Listings</button>
            <button id="dashTabMessages" onclick="switchDashTab('messages')" class="flex-1 py-2 text-slate-400 text-center">In-App Messages</button>
          </div>

          <!-- Active Listings & Bump System -->
          <div id="dashListingsView" class="space-y-3">
            <button onclick="toggleModal(true); toggleElement('accountModal', false);" class="w-full bg-amber-400 hover:bg-amber-300 text-slate-900 font-extrabold py-2 rounded-xl transition text-center shadow text-xs">
              <i class="fa-solid fa-plus mr-1"></i> Post New Listing
            </button>
            <div id="dashListingsContainer" class="space-y-2 max-h-56 overflow-y-auto"></div>
          </div>

          <!-- Inbox Messages -->
          <div id="dashMessagesView" class="hidden space-y-3">
            <div id="inboxConversations" class="space-y-2 max-h-64 overflow-y-auto"></div>
          </div>
        </div>

      </div>
    </div>
  </div>

  <!-- ITEM DETAILS & DIRECT MESSAGING MODAL -->
  <div id="itemDetailModal" class="hidden fixed inset-0 bg-slate-900/70 backdrop-blur-sm z-50 flex items-center justify-center p-4" onclick="toggleElement('itemDetailModal', false)">
    <div class="bg-white w-full max-w-xl rounded-2xl shadow-2xl overflow-hidden max-h-[90vh] flex flex-col" onclick="event.stopPropagation()">
      <div class="relative h-60 bg-slate-900">
        <img id="detailImage" src="" class="w-full h-full object-cover">
        <button onclick="toggleElement('itemDetailModal', false)" type="button" class="absolute top-3 right-3 bg-slate-900/80 text-white w-8 h-8 rounded-full flex items-center justify-center font-bold text-lg">&times;</button>
        <span id="detailConditionBadge" class="absolute bottom-3 left-3 bg-emerald-600 text-white text-xs font-bold px-2.5 py-1 rounded-md shadow">Good</span>
      </div>

      <div class="p-5 overflow-y-auto space-y-4 text-sm flex-1">
        <div class="flex justify-between items-start">
          <div>
            <h3 id="detailTitle" class="font-bold text-lg text-slate-900">Item Title</h3>
            <p id="detailLocation" class="text-xs text-slate-500 mt-0.5">Location</p>
          </div>
          <div>
            <div id="detailPrice" class="text-2xl font-black text-emerald-600">$0</div>
            <div id="detailOldPrice" class="text-xs text-red-500 font-bold line-through text-right"></div>
          </div>
        </div>

        <div class="bg-slate-50 p-3 rounded-xl border border-slate-200">
          <p class="text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1">Item Description</p>
          <p id="detailDesc" class="text-slate-700 text-xs leading-relaxed">Description goes here...</p>
        </div>

        <!-- Send Direct Message -->
        <div class="border-t border-slate-200 pt-3">
          <h4 class="font-bold text-slate-900 text-xs mb-2"><i class="fa-solid fa-comments text-emerald-600 mr-1.5"></i>Send Message or Cash Offer</h4>
          <form onsubmit="handleSendDirectMessage(event)" class="space-y-2">
            <div class="flex gap-2">
              <input type="number" id="offerPriceInput" placeholder="Offer ($)" class="w-1/3 px-3 py-2 border border-slate-300 rounded-xl text-xs font-bold">
              <input type="text" id="directMessageInput" required placeholder="Is this available for pickup?" class="flex-1 px-3 py-2 border border-slate-300 rounded-xl text-xs">
            </div>
            <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-extrabold py-2.5 rounded-xl transition shadow text-xs">
              Send Offer to Seller
            </button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <!-- SELLER ITEM UPLOAD MODAL -->
  <div id="sellerModal" class="hidden fixed inset-0 bg-slate-900/70 backdrop-blur-sm z-50 flex items-center justify-center p-4" onclick="toggleModal(false)">
    <div class="bg-white w-full max-w-lg rounded-2xl shadow-2xl overflow-hidden max-h-[90vh] flex flex-col" onclick="event.stopPropagation()">
      <div class="bg-emerald-600 text-white px-6 py-4 flex items-center justify-between">
        <h3 class="font-bold text-base"><i class="fa-solid fa-tag mr-2"></i>Post Item for Sale</h3>
        <button onclick="toggleModal(false)" type="button" class="text-emerald-100 hover:text-white text-2xl font-bold cursor-pointer px-2">&times;</button>
      </div>

      <form id="itemForm" onsubmit="handleFormSubmit(event)" class="p-5 overflow-y-auto space-y-3 text-sm flex-1">
        <div>
          <label class="block font-semibold text-slate-700 mb-1 text-xs">Item Title *</label>
          <input type="text" id="itemTitle" required placeholder="e.g. DeWalt Cordless Drill Kit" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-xs">
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block font-semibold text-slate-700 mb-1 text-xs">Price ($) *</label>
            <input type="number" id="itemPrice" required placeholder="45" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-xs">
          </div>
          <div>
            <label class="block font-semibold text-slate-700 mb-1 text-xs">Category</label>
            <select id="itemCategory" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-xs bg-white">
              <option value="Tools">Tools & Lawn</option>
              <option value="Furniture">Furniture</option>
              <option value="Electronics">Electronics</option>
              <option value="Apparel">Apparel</option>
              <option value="Other">Other</option>
            </select>
          </div>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block font-semibold text-slate-700 mb-1 text-xs">Condition *</label>
            <select id="itemCondition" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-xs bg-white font-semibold text-emerald-800">
              <option value="New">New (Unopened)</option>
              <option value="Like New">Like New</option>
              <option value="Good" selected>Good</option>
              <option value="Fair">Fair</option>
              <option value="For Parts">For Parts / Repair</option>
            </select>
          </div>
          <div>
            <label class="block font-semibold text-slate-700 mb-1 text-xs">Neighborhood *</label>
            <select id="itemLocation" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-xs bg-white">
              <option value="Nederland">Nederland</option>
              <option value="Groves">Groves</option>
              <option value="West Beaumont">West Beaumont</option>
              <option value="Orange County">Orange County</option>
            </select>
          </div>
        </div>

        <div>
          <label class="block font-semibold text-slate-700 mb-1 text-xs">Fulfillment Option *</label>
          <select id="itemFulfillment" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-xs bg-white">
            <option value="Local Pickup">Local Porch Pickup Only</option>
            <option value="Shipping Available">Shipping Available</option>
          </select>
        </div>

        <div>
          <label class="block font-semibold text-slate-700 mb-1 text-xs">Photo Image URL</label>
          <input type="url" id="itemPhoto" placeholder="Paste image link or leave blank for default" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-xs">
        </div>

        <div>
          <label class="block font-semibold text-slate-700 mb-1 text-xs">Description</label>
          <textarea id="itemDesc" rows="2" placeholder="Describe item condition..." class="w-full px-3 py-2 border border-slate-300 rounded-lg text-xs"></textarea>
        </div>

        <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-extrabold py-3 rounded-xl transition shadow text-xs uppercase">
          Publish Listing
        </button>
      </form>
    </div>
  </div>

  <script>
    var map = null;
    var mapMarkers = [];
    var currentUser = null;
    var activeCategory = 'All';
    var showOnlyFavorites = false;
    var activeSelectedItem = null;

    var areaCoords = {
      'Nederland': [29.9749, -93.9924],
      'Groves': [29.9488, -93.9168],
      'West Beaumont': [30.0802, -94.1266],
      'Orange County': [30.0933, -93.7360]
    };

    var defaultItems = [
      {
        id: 'item_1',
        sellerId: 'user_dave',
        sellerName: "Dave's Tools",
        title: "DeWalt 20V Cordless Drill Kit",
        price: 45,
        originalPrice: 65,
        category: "Tools",
        condition: "Like New",
        location: "Nederland",
        fulfillment: "Local Pickup",
        photo: "https://images.unsplash.com/photo-1504148455328-c376907d081c?auto=format&fit=crop&w=600&q=80",
        desc: "Includes 2Ah battery, charger, and original soft carry bag.",
        timestamp: Date.now() - 100000
      },
      {
        id: 'item_2',
        sellerId: 'user_sarah',
        sellerName: "Sarah M.",
        title: "Solid Oak Coffee Table",
        price: 40,
        originalPrice: null,
        category: "Furniture",
        condition: "Good",
        location: "Groves",
        fulfillment: "Local Pickup",
        photo: "https://images.unsplash.com/photo-1533090161767-e6ffed986c88?auto=format&fit=crop&w=600&q=80",
        desc: "Solid wood with bottom storage shelf. Minor surface scratches.",
        timestamp: Date.now() - 200000
      },
      {
        id: 'item_3',
        sellerId: 'user_mark',
        sellerName: "Mark's Tech",
        title: "43 Inch Smart LED TV",
        price: 85,
        originalPrice: 110,
        category: "Electronics",
        condition: "Good",
        location: "West Beaumont",
        fulfillment: "Shipping Available",
        photo: "https://images.unsplash.com/photo-1593784991095-a205069470b6?auto=format&fit=crop&w=600&q=80",
        desc: "4K resolution smart TV with original remote control included.",
        timestamp: Date.now() - 300000
      }
    ];

    function getStoredItems() {
      var saved = localStorage.getItem('yardsale_items_v3');
      return saved ? JSON.parse(saved) : defaultItems;
    }
    function saveStoredItems(items) { localStorage.setItem('yardsale_items_v3', JSON.stringify(items)); }

    function getStoredFavorites() {
      return JSON.parse(localStorage.getItem('yardsale_favs_v3') || '[]');
    }
    function saveStoredFavorites(favs) { localStorage.setItem('yardsale_favs_v3', JSON.stringify(favs)); }

    function getStoredMessages() {
      return JSON.parse(localStorage.getItem('yardsale_msgs_v3') || '[]');
    }
    function saveStoredMessages(msgs) { localStorage.setItem('yardsale_msgs_v3', JSON.stringify(msgs)); }

    function toggleElement(id, show) {
      var el = document.getElementById(id);
      if (el) el.classList.toggle('hidden', !show);
    }
    function toggleModal(show) { toggleElement('sellerModal', show); }

    function switchMainView(view) {
      var isGrid = view === 'grid';
      toggleElement('itemsGrid', isGrid);
      toggleElement('mapViewContainer', !isGrid);

      document.getElementById('viewGridBtn').className = isGrid 
        ? "px-2.5 py-1 rounded-md text-xs font-bold bg-white text-emerald-700 shadow"
        : "px-2.5 py-1 rounded-md text-xs font-semibold text-emerald-100 hover:text-white";

      document.getElementById('viewMapBtn').className = !isGrid 
        ? "px-2.5 py-1 rounded-md text-xs font-bold bg-white text-emerald-700 shadow"
        : "px-2.5 py-1 rounded-md text-xs font-semibold text-emerald-100 hover:text-white";

      if (!isGrid) {
        initLeafletMap();
      }
    }

    function initLeafletMap() {
      setTimeout(function() {
        if (!map) {
          map = L.map('leafletMap').setView([29.98, -93.95], 11);
          L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 18,
            attribution: '&copy; OpenStreetMap'
          }).addTo(map);
        }
        map.invalidateSize();
        renderMapMarkers();
      }, 100);
    }

    function renderMapMarkers() {
      if (!map) return;
      mapMarkers.forEach(function(m) { map.removeLayer(m); });
      mapMarkers = [];

      var items = getFilteredItems();
      items.forEach(function(item) {
        var baseCoords = areaCoords[item.location] || [29.98, -93.95];
        var lat = baseCoords[0] + (Math.random() - 0.5) * 0.02;
        var lng = baseCoords[1] + (Math.random() - 0.5) * 0.02;

        var marker = L.marker([lat, lng]).addTo(map);
        marker.bindPopup(`
          <div style="width: 160px; font-family: sans-serif;">
            <img src="${item.photo}" style="width:100%; height:80px; object-fit:cover; border-radius:6px; mb-1;">
            <div style="font-weight:bold; font-size:12px; margin-top:4px;">${item.title}</div>
            <div style="color:#059669; font-weight:800; font-size:13px;">$${item.price}</div>
            <div style="font-size:10px; color:#64748b;">${item.location} • ${item.condition}</div>
            <button onclick="openItemDetails('${item.id}')" style="width:100%; bg-color:#059669; background:#059669; color:white; border:none; padding:4px; border-radius:4px; font-weight:bold; font-size:10px; margin-top:6px; cursor:pointer;">View Details</button>
          </div>
        `);
        mapMarkers.push(marker);
      });
    }

    function toggleFavorite(e, itemId) {
      e.stopPropagation();
      var favs = getStoredFavorites();
      var idx = favs.indexOf(itemId);
      if (idx > -1) favs.splice(idx, 1);
      else favs.push(itemId);
      saveStoredFavorites(favs);
      renderGrid();
    }

    function toggleFavoritesFilter() {
      showOnlyFavorites = !showOnlyFavorites;
      var btn = document.getElementById('favoritesNavBtn');
      btn.classList.toggle('bg-rose-600', showOnlyFavorites);
      btn.classList.toggle('bg-emerald-700', !showOnlyFavorites);
      renderGrid();
    }

    function resetFilters() {
      showOnlyFavorites = false;
      activeCategory = 'All';
      document.getElementById('searchInput').value = '';
      document.getElementById('fulfillmentFilter').value = 'All';
      document.getElementById('favoritesNavBtn').className = "bg-emerald-700 hover:bg-emerald-800 text-white p-2 sm:px-3 sm:py-2 rounded-lg text-xs md:text-sm font-medium transition flex items-center space-x-1.5 cursor-pointer";
      renderGrid();
    }

    function filterCategory(cat) {
      activeCategory = cat;
      renderGrid();
    }

    function handleSearch() { renderGrid(); }

    function getFilteredItems() {
      var items = getStoredItems();
      var search = (document.getElementById('searchInput').value || document.getElementById('searchInputMobile').value || "").toLowerCase();
      var fulfillment = document.getElementById('fulfillmentFilter').value;
      var favs = getStoredFavorites();

      // Sort by newest/bumped
      items.sort(function(a, b) { return (b.timestamp || 0) - (a.timestamp || 0); });

      if (showOnlyFavorites) {
        items = items.filter(function(i) { return favs.includes(i.id); });
      }

      if (activeCategory !== 'All') {
        items = items.filter(function(i) { return i.category === activeCategory; });
      }

      if (fulfillment !== 'All') {
        items = items.filter(function(i) { return i.fulfillment === fulfillment; });
      }

      if (search) {
        items = items.filter(function(i) {
          return i.title.toLowerCase().includes(search) || i.desc.toLowerCase().includes(search);
        });
      }

      return items;
    }

    function renderGrid() {
      var grid = document.getElementById('itemsGrid');
      var items = getFilteredItems();
      var favs = getStoredFavorites();

      if (items.length === 0) {
        grid.innerHTML = `
          <div class="col-span-full text-center py-12 text-slate-400">
            <i class="fa-solid fa-box-open text-4xl mb-2"></i>
            <p class="text-sm font-semibold">No items match your criteria.</p>
          </div>
        `;
        return;
      }

      grid.innerHTML = items.map(function(item) {
        var isFav = favs.includes(item.id);
        var isDiscounted = item.originalPrice && item.originalPrice > item.price;

        return `
          <div onclick="openItemDetails('${item.id}')" class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden hover:shadow-md transition cursor-pointer flex flex-col justify-between relative group">
            <div>
              <div class="relative h-36 bg-slate-100">
                <img src="${item.photo}" class="w-full h-full object-cover">
                
                <!-- Heart / Favorite Button -->
                <button onclick="toggleFavorite(event, '${item.id}')" class="absolute top-2 right-2 w-7 h-7 rounded-full bg-slate-900/60 backdrop-blur-md flex items-center justify-center text-white hover:scale-110 transition z-10">
                  <i class="fa-solid fa-heart ${isFav ? 'text-rose-500' : 'text-slate-300'} text-xs"></i>
                </button>

                <!-- Condition Tag -->
                <span class="absolute top-2 left-2 bg-slate-900/80 backdrop-blur-md text-white font-bold text-[10px] px-2 py-0.5 rounded shadow">
                  ${item.condition || 'Good'}
                </span>

                <!-- Price Cut Badge -->
                ${isDiscounted ? `<span class="absolute bottom-2 left-2 bg-rose-600 text-white font-black text-[9px] px-1.5 py-0.5 rounded uppercase shadow"><i class="fa-solid fa-arrow-down mr-0.5"></i>Price Cut</span>` : ''}
              </div>

              <div class="p-3">
                <div class="flex items-center justify-between text-[10px] text-slate-500 mb-0.5">
                  <span class="font-bold text-emerald-700 truncate">${item.sellerName}</span>
                  <span>${item.location}</span>
                </div>
                
                <h3 class="font-bold text-slate-900 text-xs line-clamp-1">${item.title}</h3>
                
                <div class="flex items-baseline space-x-1.5 mt-1">
                  <span class="text-sm font-extrabold text-slate-900">$${item.price}</span>
                  ${isDiscounted ? `<span class="text-[10px] text-red-500 line-through font-semibold">$${item.originalPrice}</span>` : ''}
                </div>
              </div>
            </div>

            <div class="px-3 pb-3">
              <span class="block w-full text-center bg-slate-100 hover:bg-emerald-50 text-slate-700 hover:text-emerald-700 font-bold py-1.5 rounded-lg text-[10px] border border-slate-200">
                View & Offer
              </span>
            </div>
          </div>
        `;
      }).join('');

      renderMapMarkers();
    }

    function openItemDetails(itemId) {
      var items = getStoredItems();
      var item = items.find(function(i) { return i.id === itemId; });
      if (!item) return;

      activeSelectedItem = item;
      document.getElementById('detailTitle').innerText = item.title;
      document.getElementById('detailPrice').innerText = '$' + item.price;
      
      var oldPriceEl = document.getElementById('detailOldPrice');
      if (item.originalPrice && item.originalPrice > item.price) {
        oldPriceEl.innerText = '$' + item.originalPrice;
        oldPriceEl.classList.remove('hidden');
      } else {
        oldPriceEl.classList.add('hidden');
      }

      document.getElementById('detailLocation').innerText = item.location + ' • ' + item.fulfillment;
      document.getElementById('detailConditionBadge').innerText = item.condition || 'Good';
      document.getElementById('detailDesc').innerText = item.desc;
      document.getElementById('detailImage').src = item.photo;

      toggleElement('itemDetailModal', true);
    }

    function handleSendDirectMessage(e) {
      e.preventDefault();
      if (!activeSelectedItem) return;

      var offer = document.getElementById('offerPriceInput').value;
      var msgText = document.getElementById('directMessageInput').value;

      var msgs = getStoredMessages();
      msgs.unshift({
        id: 'msg_' + Date.now(),
        sellerId: activeSelectedItem.sellerId,
        buyerName: currentUser ? currentUser.name : 'Neighbor Buyer',
        itemTitle: activeSelectedItem.title,
        offerPrice: offer,
        text: msgText
      });
      saveStoredMessages(msgs);

      document.getElementById('offerPriceInput').value = '';
      document.getElementById('directMessageInput').value = '';
      toggleElement('itemDetailModal', false);
      alert('Offer sent to seller!');
    }

    function bumpListing(itemId) {
      var items = getStoredItems();
      var item = items.find(function(i) { return i.id === itemId; });
      if (item) {
        item.timestamp = Date.now();
        saveStoredItems(items);
        renderDashboard();
        renderGrid();
        alert('Listing bumped to top of feed!');
      }
    }

    function handleFormSubmit(e) {
      e.preventDefault();
      var newItem = {
        id: 'item_' + Date.now(),
        sellerId: currentUser ? currentUser.id : 'anon',
        sellerName: currentUser ? currentUser.name : 'Local Seller',
        title: document.getElementById('itemTitle').value,
        price: Number(document.getElementById('itemPrice').value),
        originalPrice: null,
        category: document.getElementById('itemCategory').value,
        condition: document.getElementById('itemCondition').value,
        location: document.getElementById('itemLocation').value,
        fulfillment: document.getElementById('itemFulfillment').value,
        photo: document.getElementById('itemPhoto').value || 'https://images.unsplash.com/photo-1526170375885-4d8ecf77b99f?auto=format&fit=crop&w=600&q=80',
        desc: document.getElementById('itemDesc').value || 'Available now.',
        timestamp: Date.now()
      };

      var items = getStoredItems();
      items.unshift(newItem);
      saveStoredItems(items);

      document.getElementById('itemForm').reset();
      toggleModal(false);
      renderGrid();
      alert('Listing created!');
    }

    function handleListButtonClick() {
      if (!currentUser) {
        alert("Please sign in or create an account first!");
        openAccountModal('login');
      } else {
        toggleModal(true);
      }
    }

    function openAccountModal(tab) {
      if (currentUser) {
        renderDashboard();
        switchDashTab(tab === 'messages' ? 'messages' : 'listings');
      } else {
        switchAuthTab('login');
      }
      toggleElement('accountModal', true);
    }

    function closeAccountModal(e) {
      if (e.target.id === 'accountModal') toggleElement('accountModal', false);
    }

    function switchAuthTab(tab) {
      toggleElement('loginForm', tab === 'login');
      toggleElement('registerForm', tab === 'register');
    }

    function switchDashTab(tab) {
      toggleElement('dashListingsView', tab === 'listings');
      toggleElement('dashMessagesView', tab === 'messages');
    }

    function handleRegister(e) {
      e.preventDefault();
      currentUser = {
        id: 'user_' + Date.now(),
        name: document.getElementById('regName').value,
        username: document.getElementById('regUsername').value,
        location: document.getElementById('regLocation').value
      };
      updateNavUser();
      renderDashboard();
    }

    function handleLogin(e) {
      e.preventDefault();
      currentUser = {
        id: 'user_dave',
        name: document.getElementById('loginUsername').value || "Dave's Shop",
        location: 'Nederland'
      };
      updateNavUser();
      renderDashboard();
    }

    function handleLogout() {
      currentUser = null;
      updateNavUser();
      toggleElement('authFormsContainer', true);
      toggleElement('userDashboardContainer', false);
    }

    function updateNavUser() {
      document.getElementById('accountNavText').innerText = currentUser ? currentUser.name : "Sign In";
    }

    function renderDashboard() {
      toggleElement('authFormsContainer', false);
      toggleElement('userDashboardContainer', true);

      document.getElementById('dashName').innerText = currentUser.name;
      document.getElementById('dashAvatar').innerText = currentUser.name.charAt(0).toUpperCase();

      var items = getStoredItems().filter(function(i) { return i.sellerId === currentUser.id; });
      var container = document.getElementById('dashListingsContainer');

      if (items.length === 0) {
        container.innerHTML = '<p class="text-xs text-slate-400 py-3 text-center">No active listings.</p>';
      } else {
        container.innerHTML = items.map(function(item) {
          return `
            <div class="flex items-center justify-between p-2 bg-slate-50 rounded-xl border border-slate-200 text-xs">
              <div class="flex items-center space-x-2 overflow-hidden">
                <img src="${item.photo}" class="w-8 h-8 rounded object-cover">
                <div class="truncate">
                  <p class="font-bold text-slate-800 truncate">${item.title}</p>
                  <p class="text-[10px] text-slate-500">$${item.price} • ${item.condition}</p>
                </div>
              </div>
              <button onclick="bumpListing('${item.id}')" class="bg-emerald-100 hover:bg-emerald-200 text-emerald-800 font-bold px-2 py-1 rounded text-[10px] flex-shrink-0">
                <i class="fa-solid fa-arrow-up mr-1"></i>Bump
              </button>
            </div>
          `;
        }).join('');
      }

      var msgs = getStoredMessages();
      var inbox = document.getElementById('inboxConversations');
      if (msgs.length === 0) {
        inbox.innerHTML = '<p class="text-xs text-slate-400 py-3 text-center">No messages received.</p>';
      } else {
        inbox.innerHTML = msgs.map(function(m) {
          return `
            <div class="p-2.5 bg-slate-50 rounded-xl border border-slate-200 text-xs space-y-1">
              <div class="flex justify-between font-bold">
                <span>${m.buyerName}</span>
                ${m.offerPrice ? `<span class="bg-amber-100 text-amber-800 px-1 rounded text-[10px]">Offer: $${m.offerPrice}</span>` : ''}
              </div>
              <p class="text-[10px] text-slate-500">Item: ${m.itemTitle}</p>
              <p class="text-slate-700 bg-white p-1.5 rounded border border-slate-200 italic">"${m.text}"</p>
            </div>
          `;
        }).join('');
      }
    }

    window.addEventListener('DOMContentLoaded', function() {
      renderGrid();
    });
  </script>
</body>
</html>
